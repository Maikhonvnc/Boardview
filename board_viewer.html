<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boardview — viewer local</title>
<style>
 html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font:14px/1.4 system-ui,Segoe UI,sans-serif;overflow:hidden}
 #cv{display:block;position:absolute;inset:0;cursor:grab;touch-action:none}
 #cv.drag{cursor:grabbing}
 #panel{position:absolute;top:10px;right:10px;width:230px;background:#161b22ee;border:1px solid #30363d;border-radius:10px;padding:12px;backdrop-filter:blur(4px)}
 #panel h2{margin:0 0 8px;font-size:15px}
 .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
 .row button,.tb button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px}
 .row button:hover,.tb button:hover{background:#30363d}
 #netinfo{font-weight:600;font-size:16px;min-height:20px;word-break:break-all}
 #voltinfo{font-size:22px;font-weight:700;min-height:26px}
 .hint{color:#7d8590;font-size:12px}
 #tb{position:absolute;top:10px;left:10px;background:#161b22ee;border:1px solid #30363d;border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px)}
 #tb label{margin-right:12px;cursor:pointer;user-select:none}
 #title{font-weight:600;margin-right:14px}
 #legend{position:absolute;bottom:10px;left:10px;background:#161b22ee;border:1px solid #30363d;border-radius:10px;padding:8px 10px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:60vw}
 .lg{display:flex;align-items:center;gap:4px}.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
</style></head><body>
<canvas id="cv"></canvas>
<div id="tb"><select id="boardsel" style="background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:4px 6px;margin-right:12px;max-width:240px"></select>
 <label><input type="checkbox" id="cbImg" checked> Foto</label>
 <label><input type="checkbox" id="cbPins" checked> Pinos</label>
 <label><input type="checkbox" id="cbVias" checked> Vias</label>
 <label><input type="checkbox" id="cbVolt" checked> Tensões</label>
</div>
<div id="panel">
 <h2>Malha</h2>
 <div id="netinfo" class="hint">clique num pad/via</div>
 <div id="voltinfo"></div>
 <div class="row">
  <button id="btnVolt">⚡ Definir tensão</button>
  <button id="btnClr">✖ Limpar</button>
 </div>
 <div class="hint">Tecla <b>V</b> = tensão da malha selecionada · <b>F</b> = enquadrar · arraste = mover · roda = zoom</div>
 <div class="row"><button id="btnExport">⬇ Exportar tensões</button><button id="btnImport">⬆ Importar</button></div>
</div>
<div id="legend"></div>
<script>
const qs=new URLSearchParams(location.search);
const BOARD=qs.get('b')||'mini2';
const DATA_URL='viewer_data/'+BOARD+'.json';
let D,IMG,view={x:0,y:0,z:1},drag=null,selNet=null;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const opt={img:1,pins:1,vias:1,volt:1};

// paleta de tensao (igual ao OBV): trilho comum -> cor fixa; senao hue do valor
const BANDS=[[12,'#dc2626'],[8,'#f97316'],[5,'#22c55e'],[3.3,'#0ea5e9'],[3.0,'#14b8a6'],[2.8,'#84cc16'],[1.8,'#a855f7'],[1.2,'#eab308'],[1.0,'#ec4899'],[0.8,'#64748b']];
function hsv(h,s,v){h=((h%360)+360)%360;let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r,g,b;
 [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h/60)%6].forEach;
 const seg=[[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h/60)%6];[r,g,b]=seg;
 return `rgb(${Math.round((r+m)*255)},${Math.round((g+m)*255)},${Math.round((b+m)*255)})`;}
function voltColor(v){for(const[bv,c]of BANDS)if(Math.abs(bv-v)<=0.2)return c;return hsv(v*57+15,0.85,0.95);}
function parseVolt(s){if(!s)return null;let m=(''+s).replace(',','.').match(/(\d+(?:\.\d+)?)\s*[vV]?(\d)?/);
 if(!m)return null;let x=m[1];if(m[2])x+='.'+m[2];let v=parseFloat(x);return(v>=0&&v<=60)?v:null;}

// tensoes salvas por placa+net
const LSK='volts_'+BOARD;
let volts=JSON.parse(localStorage.getItem(LSK)||'{}');
function saveVolts(){localStorage.setItem(LSK,JSON.stringify(volts));drawLegend();}

function worldToScreen(x,y){return[(x-view.x)*view.z,cv.height-(y-view.y)*view.z];}
function screenToWorld(sx,sy){return[sx/view.z+view.x,(cv.height-sy)/view.z+view.y];}

function fit(){const pad=40,z=Math.min((cv.width-pad)/D.W,(cv.height-pad)/D.H);
 view.z=z;view.x=D.W/2-cv.width/2/z;view.y=D.H/2-cv.height/2/z;draw();}

function draw(){
 cv.width=innerWidth;cv.height=innerHeight;
 ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cv.width,cv.height);
 // foto de fundo alinhada (image cobre world [0,W]x[0,H], row0 = y alto)
 if(opt.img&&IMG){const[tx,ty]=worldToScreen(0,D.H);ctx.imageSmoothingEnabled=true;
  ctx.globalAlpha=1;ctx.drawImage(IMG,tx,ty,D.W*view.z,D.H*view.z);}
 // outline
 ctx.strokeStyle='#f85149';ctx.lineWidth=1.5;ctx.beginPath();
 for(const s of D.outline){const[a,b]=worldToScreen(s[0],s[1]),[c,d]=worldToScreen(s[2],s[3]);ctx.moveTo(a,b);ctx.lineTo(c,d);}
 ctx.stroke();
 const zz=view.z;
 // vias (circulos)
 if(opt.vias){for(const v of D.vias){const[x,y]=worldToScreen(v.x,v.y);
   if(x<-5||x>cv.width+5||y<-5||y>cv.height+5)continue;
   let col=colorFor(v.net,'#c9a227');ctx.fillStyle=col;
   ctx.beginPath();ctx.arc(x,y,Math.max(1.5,2.4*zz),0,7);ctx.fill();}}
 // pinos (retangulos)
 if(opt.pins){const r=Math.max(1.5,3*zz);for(const p of D.pins){const[x,y]=worldToScreen(p.x,p.y);
   if(x<-5||x>cv.width+5||y<-5||y>cv.height+5)continue;
   ctx.fillStyle=colorFor(p.net,'#4d7cfe');ctx.fillRect(x-r,y-r,2*r,2*r);}}
 // realce da malha selecionada
 if(selNet){ctx.lineWidth=2;ctx.strokeStyle='#fff';
  for(const p of D.pins)if(p.net===selNet){const[x,y]=worldToScreen(p.x,p.y);const r=Math.max(2,3.5*zz);ctx.strokeRect(x-r,y-r,2*r,2*r);}
  for(const v of D.vias)if(v.net===selNet){const[x,y]=worldToScreen(v.x,v.y);ctx.beginPath();ctx.arc(x,y,Math.max(2.5,3.2*zz),0,7);ctx.stroke();}}
}
function colorFor(net,def){
 if(opt.volt&&net&&volts[net]!=null){const v=parseVolt(volts[net]);if(v!=null)return voltColor(v);}
 if(net&&net===selNet)return '#ffd33d';
 return def;
}
function drawLegend(){const el=document.getElementById('legend');const used={};
 for(const n in volts){const v=parseVolt(volts[n]);if(v!=null)used[v]=voltColor(v);}
 const ks=Object.keys(used).sort((a,b)=>b-a);
 el.innerHTML=ks.length?ks.map(v=>`<span class="lg"><span class="sw" style="background:${used[v]}"></span>${v}V</span>`).join(''):'<span class="hint">sem tensões — selecione uma malha e tecle V</span>';
}

// interacao
function nearest(sx,sy){let best=null,bd=14*14;
 for(const p of D.pins){const[x,y]=worldToScreen(p.x,p.y);const d=(x-sx)**2+(y-sy)**2;if(d<bd){bd=d;best=p;}}
 for(const v of D.vias){const[x,y]=worldToScreen(v.x,v.y);const d=(x-sx)**2+(y-sy)**2;if(d<bd){bd=d;best=v;}}
 return best;}
function selectAt(sx,sy){const e=nearest(sx,sy);if(e&&e.net){selNet=e.net;showNet();}else{selNet=null;showNet();}draw();}
function showNet(){document.getElementById('netinfo').textContent=selNet||'—';
 document.getElementById('netinfo').className=selNet?'':'hint';
 const v=selNet?volts[selNet]:null;const vinfo=document.getElementById('voltinfo');
 if(v!=null){const pv=parseVolt(v);vinfo.textContent=v+(/[vV]/.test(v)?'':'V');vinfo.style.color=pv!=null?voltColor(pv):'#e6edf3';}
 else vinfo.textContent='';}
function setVolt(){if(!selNet){alert('Selecione uma malha primeiro (clique num pad).');return;}
 const cur=volts[selNet]||'';const s=prompt('Tensão da malha '+selNet+' (ex: 5, 3.3, 8, 1.8). Vazio = apagar:',cur);
 if(s===null)return;if(s.trim()===''){delete volts[selNet];}else{volts[selNet]=s.trim();}saveVolts();showNet();draw();}

cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:0};cv.classList.add('drag');});
addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);
 view.x=drag.vx-dx/view.z;view.y=drag.vy+dy/view.z;draw();});
addEventListener('mouseup',e=>{if(drag&&drag.moved<4)selectAt(e.clientX,e.clientY);drag=null;cv.classList.remove('drag');});
cv.addEventListener('wheel',e=>{e.preventDefault();const[wx,wy]=screenToWorld(e.clientX,e.clientY);
 view.z*=e.deltaY<0?1.15:1/1.15;
 const[nx,ny]=screenToWorld(e.clientX,e.clientY);view.x+=wx-nx;view.y+=wy-ny;draw();},{passive:false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='v')setVolt();else if(k==='f')fit();else if(k==='escape'){selNet=null;showNet();draw();}});
addEventListener('resize',draw);
document.getElementById('btnVolt').onclick=setVolt;
document.getElementById('btnClr').onclick=()=>{selNet=null;showNet();draw();};
for(const[id,key]of[['cbImg','img'],['cbPins','pins'],['cbVias','vias'],['cbVolt','volt']])
 document.getElementById(id).onchange=e=>{opt[key]=e.target.checked?1:0;draw();};
document.getElementById('btnExport').onclick=()=>{const b=new Blob([JSON.stringify(volts,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=BOARD+'_tensoes.json';a.click();};
document.getElementById('btnImport').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';
 i.onchange=()=>{const fr=new FileReader();fr.onload=()=>{try{volts=JSON.parse(fr.result);saveVolts();draw();}catch(x){alert('json inválido');}};fr.readAsText(i.files[0]);};i.click();};

// lista de placas -> dropdown
fetch('viewer_data/boards.json').then(r=>r.json()).then(list=>{const sel=document.getElementById('boardsel');
 for(const b of list){const o=document.createElement('option');o.value=b.id;o.textContent=b.name;if(b.id===BOARD)o.selected=true;sel.appendChild(o);}
 sel.onchange=()=>location.search='?b='+sel.value;}).catch(()=>{document.getElementById('boardsel').style.display='none';});

fetch(DATA_URL).then(r=>r.json()).then(d=>{D=d;
 drawLegend();
 if(d.img){IMG=new Image();IMG.onload=()=>fit();IMG.onerror=()=>fit();IMG.src='viewer_data/'+d.img.file;}else fit();
}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<p style="color:#f85149;position:absolute;top:50%;left:20px">Erro ao carregar '+DATA_URL+' — abra via servidor local (não file://). Rode: <b>python -m http.server</b> na pasta Boardview.</p>');});
</script></body></html>
