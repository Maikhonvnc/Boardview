<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visualizador Boardview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px/1.4 system-ui,Segoe UI,sans-serif;background:#0b0e13;color:#e6edf3}
#bar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;gap:8px;align-items:center;padding:0 12px;background:#12161d;border-bottom:1px solid #263041;z-index:5;flex-wrap:wrap}
#bar b{font-size:15px}
#q{flex:0 0 230px;background:#0b0e13;border:1px solid #2b3a52;color:#e6edf3;border-radius:7px;padding:6px 10px}
button{background:#182030;border:1px solid #2b3a52;color:#cdd9e5;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:13px}
button:hover{background:#1f2b40}button.on{background:#122019;border-color:#1f6f43;color:#4ade80}
#cv{position:absolute;inset:46px 0 0 0;display:block;cursor:grab;background:#0b0e13}
#cv.grab{cursor:grabbing}
#info{position:absolute;right:12px;top:56px;width:250px;background:#12161dcc;border:1px solid #263041;border-radius:10px;padding:11px 13px;backdrop-filter:blur(4px);z-index:4;display:none;max-height:75vh;overflow:auto}
#info h3{margin:0 0 6px;font-size:14px}#info .k{color:#7d8ba0;font-size:12px}
#info .cmp{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
#info .cmp span{font-size:11px;background:#1a2130;border:1px solid #2b3a52;border-radius:5px;padding:1px 6px}
#tip{position:absolute;pointer-events:none;background:#000c;border:1px solid #3d5170;border-radius:6px;padding:3px 8px;font-size:12px;z-index:6;display:none;white-space:nowrap}
#status{position:absolute;left:12px;bottom:10px;color:#7d8ba0;font-size:12px;z-index:4}
#drop{position:absolute;inset:46px 0 0 0;display:flex;align-items:center;justify-content:center;color:#7d8ba0;flex-direction:column;gap:10px;text-align:center;padding:20px}
label.btn{background:#182030;border:1px solid #2b3a52;color:#cdd9e5;padding:6px 12px;border-radius:7px;cursor:pointer}
</style></head><body>
<div id="bar">
  <b id="title">Visualizador</b>
  <input id="q" placeholder="buscar malha/componente (botão, GND, N66732)">
  <button id="tPhoto" class="on">📷 Foto</button>
  <button id="tOutline" class="on">▭ Contorno</button>
  <button id="tPins" class="on">● Pinos</button>
  <button id="tRead" class="on">⚡ Leituras</button>
  <button id="fit">⤢ Ajustar</button>
  <span id="status"></span>
</div>
<canvas id="cv"></canvas>
<div id="tip"></div>
<div id="info"></div>
<div id="drop" style="display:none">
  <h2>Nenhuma placa carregada</h2>
  <div>Abra pelo HUB, ou carregue arquivo(s) de placa (.js/.json):</div>
  <label class="btn">📂 Carregar<input id="file" type="file" accept=".js,.json" multiple hidden></label>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),tip=document.getElementById('tip'),
 info=document.getElementById('info'),statusEl=document.getElementById('status'),q=document.getElementById('q');
let BS=[],scale=1,tx=0,ty=0,sel=null;   // BS = lista de placas com .ox (offset X) e .img
const show={photo:1,outline:1,pins:1,read:1};
const GAP=400;   // distância entre placas (unidades da placa)

const PAL=[[5,'#22c55e'],[3.3,'#0ea5e9'],[3.2,'#166534'],[2.6,'#22d3ee'],[1.8,'#f97316'],[1.6,'#ef4444'],[1.5,'#fb923c'],[1.4,'#3b82f6'],[1.1,'#991b1b'],[0.3,'#a855f7']];
function readColor(v){const n=parseFloat(String(v).replace(/[^0-9.]/g,''));if(isNaN(n))return '#e5e7eb';let b=PAL[0],bd=9e9;for(const[val,c]of PAL){const d=Math.abs(val-n);if(d<bd){bd=d;b=[val,c]}}return b[1];}

function resize(){cv.width=innerWidth;cv.height=innerHeight-46;draw();}
addEventListener('resize',resize);

function worldBox(){let W=0,H=0;for(const b of BS){W=b.ox+(b.bbox.maxX-b.bbox.minX);if(b.bbox.maxY-b.bbox.minY>H)H=b.bbox.maxY-b.bbox.minY;}return{W,H};}
function fit(){if(!BS.length)return;const{W,H}=worldBox();
 scale=Math.min(cv.width/W,cv.height/H)*0.92;tx=(cv.width-W*scale)/2;ty=(cv.height-H*scale)/2;draw();}
function SX(x){return x*scale+tx;} function SY(y){return cv.height-(y*scale+ty);}

function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);if(!BS.length)return;
 for(const b of BS){const ox=b.ox,bb=b.bbox;
  // recorte: pula placa fora da tela (arraste fluido com muitas placas)
  const bx0=SX(ox+bb.minX),bx1=SX(ox+bb.maxX),by1=SY(bb.minY),by0=SY(bb.maxY);
  if(bx1<-20||bx0>cv.width+20||by1<-20||by0>cv.height+20)continue;
  if(show.photo&&b.img&&b.img.complete&&b.img.naturalWidth){
   ctx.drawImage(b.img,SX(ox+bb.minX),SY(bb.maxY),(bb.maxX-bb.minX)*scale,(bb.maxY-bb.minY)*scale);}
  if(show.outline&&b.outline){ctx.strokeStyle='#cbd5e1';ctx.lineWidth=Math.max(1,1.3*scale/3);ctx.beginPath();
   for(const s of b.outline){ctx.moveTo(SX(ox+s[0]),SY(s[1]));ctx.lineTo(SX(ox+s[2]),SY(s[3]));}ctx.stroke();}
  if(show.pins){for(const c of b.comps)for(const p of c.pins){
    const px=SX(ox+p.x),py=SY(p.y);if(px<-5||px>cv.width+5||py<-5||py>cv.height+5)continue;
    const onSel=sel&&p.net===sel;const r=Math.max(1.3,(onSel?2.6:1.7)*scale/3);
    const nv=b.netVolt[p.net];   // tensao da malha (se ja medida) -> cor
    ctx.beginPath();ctx.arc(px,py,r,0,7);
    ctx.fillStyle=onSel?'#3b82f6':(nv?readColor(nv):(p.net==='GND'?'#334155':'#22aa33'));
    ctx.globalAlpha=sel&&!onSel?0.3:1;ctx.fill();ctx.globalAlpha=1;}}
  if(show.read){for(const c of b.comps)for(const p of c.pins)if(p.r){
    const x=SX(ox+p.x),y=SY(p.y);ctx.fillStyle=readColor(p.r);ctx.beginPath();ctx.arc(x,y,Math.max(3,2.4*scale/3),0,7);ctx.fill();
    if(scale>1.2){ctx.font=`${Math.max(9,3*scale)}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#000a';
     const w=ctx.measureText(p.r).width+6;ctx.fillRect(x-w/2,y-Math.max(9,3*scale)-6,w,Math.max(11,3*scale+3));
     ctx.fillStyle='#fff';ctx.fillText(p.r,x,y-6);}}}
  // rotulo da placa
  ctx.font='bold '+Math.max(12,Math.min(26,3.5*scale))+'px system-ui';ctx.textAlign='left';
  ctx.fillStyle='#7aa2f7';ctx.fillText(b.name, SX(ox+bb.minX), SY(bb.maxY)-8);
 }
 const{W}=worldBox();
 statusEl.textContent=`${BS.length} placa(s) · ${BS.reduce((a,b)=>a+b.comps.length,0)} comp · zoom ${scale.toFixed(2)}×`+(sel?` · malha: ${sel}`:'');
}

// pan/zoom
let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty,moved:0};cv.classList.add('grab');});
addEventListener('mouseup',()=>{if(drag&&drag.moved<4)clickAt(drag.lx,drag.ly);drag=null;cv.classList.remove('grab');});
addEventListener('mousemove',e=>{const mx=e.clientX,my=e.clientY-46;
 if(drag){drag.moved+=Math.abs(e.movementX)+Math.abs(e.movementY);drag.lx=mx;drag.ly=my;
  tx=drag.tx+(e.clientX-drag.x);ty=drag.ty-(e.clientY-drag.y);draw();return;}
 hover(mx,my,e.clientX,e.clientY);});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.15:1/1.15;
 const mx=e.clientX,my=e.clientY-46;const bx=(mx-tx)/scale,by=(cv.height-my-ty)/scale;
 scale*=f;tx=mx-bx*scale;ty=(cv.height-my)-by*scale;draw();},{passive:false});

function nearestPin(mx,my){let best=null,bd=14*14;
 for(const b of BS)for(const c of b.comps)for(const p of c.pins){const dx=SX(b.ox+p.x)-mx,dy=SY(p.y)-my,d=dx*dx+dy*dy;
  if(d<bd){bd=d;best={b,c,p};}}return best;}
function hover(mx,my,cx,cy){const h=nearestPin(mx,my);
 if(!h){tip.style.display='none';return;}
 tip.style.display='block';tip.style.left=(cx+12)+'px';tip.style.top=(cy+12)+'px';
 tip.innerHTML=`<b>${h.c.id}</b> · ${h.p.name} · <span style="color:#7aa2f7">${h.p.net}</span>`+(h.p.r?` · <b style="color:${readColor(h.p.r)}">${h.p.r}</b>`:'')+` <span style="color:#7d8ba0">(${h.b.name})</span>`;}
function clickAt(mx,my){const h=nearestPin(mx,my);if(!h){sel=null;info.style.display='none';draw();return;}sel=h.p.net;selectNet(sel);draw();}
function selectNet(net){const comps=new Set(),rd=[];
 for(const b of BS)for(const c of b.comps)for(const p of c.pins)if(p.net===net){comps.add(b.name+' · '+c.id);if(p.r)rd.push(`${c.id}.${p.name}=${p.r}`);}
 info.style.display='block';
 info.innerHTML=`<h3 style="color:#7aa2f7">${net}</h3><div class=k>${comps.size} componente(s)${rd.length?` · ${rd.length} leituras`:''}</div>`+
  (rd.length?`<div class=k style="margin-top:5px">${rd.slice(0,12).join('<br>')}</div>`:'')+
  `<div class=cmp>${[...comps].sort().map(c=>`<span>${c}</span>`).join('')}</div>`;}

q.oninput=()=>{const t=q.value.trim().toLowerCase();if(!t){sel=null;info.style.display='none';draw();return;}
 let net=null;
 outer:for(const b of BS){for(const c of b.comps){if(c.id.toLowerCase()===t){net=c.pins[0]&&c.pins[0].net;break outer;}
  for(const p of c.pins){if(p.net.toLowerCase().includes(t)){net=p.net;break outer;}}}}
 if(net){sel=net;selectNet(net);}draw();};

for(const[id,k] of [['tPhoto','photo'],['tOutline','outline'],['tPins','pins'],['tRead','read']]){
 document.getElementById(id).onclick=e=>{show[k]=!show[k];e.target.classList.toggle('on',show[k]);draw();};}
document.getElementById('fit').onclick=fit;

// ---- normaliza e adiciona placa ----
function normalizeJson(j){if(j.comps)return j;
 return {name:j.name||'Placa',bbox:j.bbox,outline:(j.outline||[]).map(o=>[o.x1,o.y1,o.x2,o.y2]),
  comps:(j.components||[]).map(c=>({id:c.id||c.name,x:c.x,y:c.y,
   pins:(c.pins||[]).map(p=>({x:p.x,y:p.y,name:p.name,net:p.netName||p.net,r:(p.diodeReading||'').trim()||null}))}))};}
function addBoard(b){b=normalizeJson(b);const{W}=worldBox();
 b.ox = BS.length? W+GAP : 0;
 // mapa malha->tensao (colore a malha toda conforme as leituras vao chegando)
 b.netVolt={}; for(const c of b.comps)for(const p of c.pins)if(p.r&&!b.netVolt[p.net])b.netVolt[p.net]=p.r;
 if(b.photo){b.img=new Image();b.img.onload=draw;b.img.onerror=()=>{b.img=null;draw();};b.img.src=b.photo;}
 BS.push(b);}
function done(){document.getElementById('drop').style.display='none';
 document.getElementById('title').textContent=BS.length>1?(new URLSearchParams(location.search).get('model')||'Workspace')+` (${BS.length} placas)`:(BS[0]&&BS[0].name)||'Placa';
 document.title=document.getElementById('title').textContent+' — Visualizador';
 resize();fit();}

// carrega um boards/<name>.js (define window.BOARD) e retorna promise
function loadScript(name){return new Promise((res,rej)=>{const s=document.createElement('script');
 s.src='boards/'+encodeURIComponent(name)+'.js';s.onload=()=>{res(window.BOARD);};s.onerror=rej;document.body.appendChild(s);});}

async function boot(){
 const p=new URLSearchParams(location.search);
 if(window.BOARD){addBoard(window.BOARD);return done();}
 if(p.get('board')){try{const b=await loadScript(p.get('board'));addBoard(b);done();}catch(e){document.getElementById('drop').style.display='flex';resize();}return;}
 if(p.get('model')){try{
   await loadScript('_models');   // define window.MODELS
   const list=(window.MODELS||{})[p.get('model')]||[];
   for(const nm of list){try{const b=await loadScript(nm);addBoard(b);}catch(e){}}
   if(BS.length)done();else{document.getElementById('drop').style.display='flex';resize();}
  }catch(e){document.getElementById('drop').style.display='flex';resize();}return;}
 document.getElementById('drop').style.display='flex';resize();
}
// API global (usada pelo boot e para testes)
window.loadModel=async function(model){BS=[];sel=null;
 try{await loadScript('_models');}catch(e){return 'sem _models.js';}
 const list=(window.MODELS||{})[model]||[];
 for(const nm of list){try{const b=await loadScript(nm);addBoard(b);}catch(e){}}
 if(BS.length){done();return BS.length;}return 0;};

document.getElementById('file').onchange=e=>{const fs=[...e.target.files];BS=[];let done_=0;
 fs.forEach(f=>{const r=new FileReader();r.onload=()=>{try{addBoard(JSON.parse(r.result));}catch(_){try{eval(r.result);addBoard(window.BOARD);}catch(__){} }
  if(++done_===fs.length)done();};r.readAsText(f);});};
boot();
